<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#071333" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ORCA X" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>ORCA X Mobile</title>
    <script>
      /* Pasang pilihan tema & bahasa sebelum aplikasi tampil, supaya tidak berkedip. */
      try {
        var th = localStorage.getItem('orcax_theme'); if (th === 'light' || th === 'dark') document.documentElement.setAttribute('data-theme', th);
        var lg = localStorage.getItem('orcax_lang'); if (lg === 'en') document.documentElement.lang = 'en';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
