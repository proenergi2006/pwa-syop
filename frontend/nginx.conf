# Satu alamat untuk PWA dan API. TLS diurus reverse proxy / load balancer di depan container ini (wajib HTTPS tepercaya).

# Alamat klien asli dari reverse proxy di jaringan privat (untuk pembatasan percobaan login dan log).
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

map $http_x_forwarded_proto $fcgi_https {
    default off;
    https   on;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 6m;   # unggah foto profil

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # --- API Laravel (PHP-FPM di service "app") ---
    location ~ ^/(api/|up$) {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTPS $fcgi_https;
        fastcgi_read_timeout 90s;   # sinkron Accurate bisa memakan waktu
        add_header Cache-Control "no-store" always;
    }

    # --- PWA: service worker dan manifest selalu dicek ulang supaya pembaruan cepat terdeteksi ---
    location = /sw.js              { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /push-sw.js         { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /index.html         { add_header Cache-Control "no-cache"; }
    location = /version.json       { add_header Cache-Control "no-store"; default_type application/json; try_files $uri =404; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; default_type application/manifest+json; try_files $uri =404; }
    location ~* ^/workbox-.*\.js$  { add_header Cache-Control "public, max-age=31536000, immutable"; }

    # Berkas ber-hash boleh di-cache lama.
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
    location /icons/  { add_header Cache-Control "public, max-age=86400"; try_files $uri =404; }
    location /models/ { add_header Cache-Control "public, max-age=2592000"; try_files $uri =404; }

    # SPA: rute klien jatuh ke index.html
    location / { try_files $uri $uri/ /index.html; }
}
