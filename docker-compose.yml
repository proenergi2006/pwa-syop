# Pemakaian:  docker compose up -d --build
# Prasyarat : backend/.env (lihat backend/.env.production.example) dan MySQL `proenergi` yang bisa dijangkau dari container.
services:
  app:
    build: ./backend
    image: orca-x-app
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # bila MySQL berjalan di host yang sama (DB_HOST=host.docker.internal)
    volumes:
      - storage:/var/www/html/storage
      - ${ORCA_WEB_FILES_HOST:-./legacy-web}:/var/www/legacy-web:ro   # folder induk web lama (berisi files/uploaded_user), isi ORCA_WEB_FILES_HOST di .env root
    healthcheck:
      test: ["CMD-SHELL", "pgrep php-fpm >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Pemantau approval baru -> push notifikasi (perintah schedule:run tiap menit).
  scheduler:
    image: orca-x-app
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    command: ["php", "artisan", "schedule:work"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - storage:/var/www/html/storage
      - ${ORCA_WEB_FILES_HOST:-./legacy-web}:/var/www/legacy-web:ro   # folder induk web lama (berisi files/uploaded_user), isi ORCA_WEB_FILES_HOST di .env root
    depends_on:
      - app

  web:
    build: ./frontend
    image: orca-x-web
    restart: unless-stopped
    ports:
      - "8080:80"     # arahkan reverse proxy HTTPS Anda ke port ini
    depends_on:
      - app

volumes:
  storage:
